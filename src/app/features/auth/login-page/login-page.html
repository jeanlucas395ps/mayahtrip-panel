<div class="pagina">
  <div class="cartao">
    <p class="cartao__kicker">{{ i18n.t('auth.kicker') }}</p>
    <h1 class="cartao__titulo">{{ i18n.t('auth.titulo') }}</h1>
    <p class="cartao__subtitulo">{{ i18n.t('auth.subtitulo') }}</p>

    <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <mt-form-field
        [rotulo]="i18n.t('auth.campoEmail')"
        [obrigatorio]="true"
        [erro]="formulario.controls.email.touched && formulario.controls.email.invalid ? i18n.t('auth.campoEmail') : null"
      >
        <input type="email" formControlName="email" autocomplete="username" />
      </mt-form-field>

      <mt-form-field [rotulo]="i18n.t('auth.campoSenha')" [obrigatorio]="true">
        <input type="password" formControlName="senha" autocomplete="current-password" />
      </mt-form-field>

      @if (erro()) {
        <p class="formulario__erro">{{ i18n.t(erro()!) }}</p>
      }

      <mt-button tipo="submit" tamanho="lg" [largoTotal]="true" [carregando]="carregando()">
        {{ carregando() ? i18n.t('auth.entrando') : i18n.t('auth.botaoEntrar') }}
      </mt-button>
    </form>

    <p class="cartao__rodape">{{ i18n.t('auth.semConta') }}</p>
  </div>
</div>
